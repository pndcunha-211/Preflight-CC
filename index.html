<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My First Build</title>
<style>
  body {
    height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle, #ffd76a 0%, #f5b731 55%, #d99a1f 100%);
  }
  h1 {
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 5rem;
    color: #1e5eff;
    margin: 0;
    animation: glow 2.5s ease-in-out infinite alternate;
  }
  @keyframes glow {
    from {
      text-shadow: 0 0 10px rgba(30, 94, 255, 0.4),
                   0 0 20px rgba(30, 94, 255, 0.3);
    }
    to {
      text-shadow: 0 0 25px rgba(30, 94, 255, 0.8),
                   0 0 50px rgba(30, 94, 255, 0.6);
    }
  }
</style>
</head>
<body>
  <h1>My First Build</h1>
</body>
</html>
